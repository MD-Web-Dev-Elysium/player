<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #151515;
  --mute: #6a6a6a;
  --line: #e4e4e4;
  --accent: #c8102e;
  --s1: 8px;
  --s2: 16px;
  --s3: 32px;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151515; --fg: #f1f1f1; --mute: #9b9b9b; --line: #2b2b2b; --accent: #ff5d6c; }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 720px; margin: 0 auto; padding: var(--s2); display: grid; gap: var(--s2); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#stage { width: 356px; max-width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: var(--radius); overflow: hidden; }
#stage.expanded { width: 100%; }
#stage iframe { width: 100%; height: 100%; border: 0; display: block; }

#add { display: flex; gap: var(--s1); }
#link {
  flex: 1; min-width: 0;
  padding: var(--s1) var(--s2);
  border: 1px solid var(--line); border-radius: var(--radius); background: transparent;
}
#add button {
  padding: var(--s1) var(--s2);
  border: 0; border-radius: var(--radius);
  background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
}

#controls { display: flex; justify-content: space-between; align-items: center; }
#controls button, .remove {
  border: 0; background: none; color: var(--mute); cursor: pointer; padding: var(--s1) 0;
}
#controls button:hover, .remove:hover { color: var(--fg); }
#status { margin: 0; min-height: 1.4em; color: var(--mute); font-size: 14px; }

#queue { list-style: none; margin: 0; padding: 0; }
#queue li { display: flex; align-items: center; border-top: 1px solid var(--line); }
.track {
  flex: 1; min-width: 0; text-align: left;
  padding: var(--s1) 0; border: 0; background: none; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.track[aria-current="true"] { color: var(--accent); font-weight: 600; }
.remove { padding-left: var(--s2); }
#empty { color: var(--mute); }
</style>
</head>
<body>
<main>
  <div id="stage"><div id="player"></div></div>

  <form id="add">
    <input id="link" type="text" placeholder="YouTube link or ID" aria-label="YouTube link or ID" autocomplete="off">
    <button id="add-button" type="submit">Add</button>
  </form>

  <div id="controls">
    <button id="prev" type="button">Previous</button>
    <button id="size" type="button" aria-pressed="false">Expand</button>
    <button id="next" type="button">Next</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>

  <ul id="queue" aria-label="Playlist"></ul>
  <p id="empty">Paste a YouTube link to start.</p>
</main>

<script>
const STORAGE_KEY = "playlist";
const $ = (id) => document.getElementById(id);

let items = load();
let index = 0;
let player = null;

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch {}
}

function videoId(text) {
  text = text.trim();
  if (/^[\w-]{11}$/.test(text)) return text;
  try {
    const url = new URL(text);
    const host = url.hostname.replace(/^www\./, "");
    let id = null;
    if (host === "youtu.be") id = url.pathname.slice(1);
    else if (host.endsWith("youtube.com")) {
      id = url.searchParams.get("v") ||
        (url.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]+)/) || [])[1];
    }
    return /^[\w-]{11}$/.test(id) ? id : null;
  } catch { return null; }
}

async function fetchTitle(id) {
  try {
    const res = await fetch("https://www.youtube.com/oembed?format=json&url=" +
      encodeURIComponent("https://www.youtube.com/watch?v=" + id));
    return (await res.json()).title;
  } catch { return null; }
}

function say(message) { $("status").textContent = message || ""; }

function render() {
  const queue = $("queue");
  queue.replaceChildren(...items.map((item, i) => {
    const li = document.createElement("li");
    const track = document.createElement("button");
    track.className = "track";
    track.type = "button";
    track.textContent = item.title || item.id;
    track.dataset.id = item.id;
    if (i === index) track.setAttribute("aria-current", "true");
    track.addEventListener("click", () => play(i));
    const remove = document.createElement("button");
    remove.className = "remove";
    remove.type = "button";
    remove.textContent = "Remove";
    remove.setAttribute("aria-label", "Remove " + (item.title || item.id));
    remove.addEventListener("click", () => removeAt(i));
    li.append(track, remove);
    return li;
  }));
  $("empty").hidden = items.length > 0;
  $("prev").disabled = $("next").disabled = items.length < 2;
}

function play(i) {
  if (!items.length || !player || !player.loadVideoById) return;
  index = (i + items.length) % items.length;
  say("");
  player.loadVideoById(items[index].id);
  render();
}

function removeAt(i) {
  items.splice(i, 1);
  if (i < index) index--;
  if (index >= items.length) index = 0;
  save();
  render();
  if (!items.length && player) player.stopVideo();
}

$("add").addEventListener("submit", async (event) => {
  event.preventDefault();
  const links = $("link").value.split(/\s+/).filter(Boolean);
  const ids = links.map(videoId);
  if (!links.length) return;
  if (ids.includes(null)) { say("Not a YouTube link or video ID."); return; }
  const wasEmpty = items.length === 0;
  const added = ids.map((id) => ({ id, title: null }));
  items.push(...added);
  $("link").value = "";
  say("");
  save();
  render();
  if (wasEmpty) play(0);
  for (const item of added) {
    item.title = await fetchTitle(item.id);
    save();
    render();
  }
});

$("size").addEventListener("click", () => {
  const expanded = $("stage").classList.toggle("expanded");
  $("size").textContent = expanded ? "Shrink" : "Expand";
  $("size").setAttribute("aria-pressed", expanded);
});

$("prev").addEventListener("click", () => play(index - 1));
$("next").addEventListener("click", () => play(index + 1));

function unmute() {
  if (player && player.unMute) player.unMute();
  say("");
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    width: "100%",
    height: "100%",
    videoId: items.length ? items[0].id : undefined,
    playerVars: { playsinline: 1, rel: 0, autoplay: 1 },
    events: {
      onReady: (e) => {
        if (!items.length) return;
        e.target.mute();
        e.target.playVideo();
        say("Playing muted. Click anywhere to unmute.");
        document.addEventListener("pointerdown", unmute, { once: true });
        document.addEventListener("keydown", unmute, { once: true });
      },
      onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) play(index + 1); },
      onError: () => { say("This video can't be played here. Skipped."); play(index + 1); }
    }
  });
}

render();
const api = document.createElement("script");
api.src = "https://www.youtube.com/iframe_api";
document.head.append(api);
</script>
</body>
</html>
